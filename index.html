<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wosu!</title>
  <!-- Self-hosted Umami analytics (page views + the game's custom events); harmless 404 on hosts without /stats. -->
  <script defer src="/stats/script.js" data-website-id="6d8d3b2c-6f09-4d97-b53d-ee1df622688e" data-tag="wosu"></script>
  <meta name="description"
    content="Play wosu! – A browser-based rhythm game inspired by osu!std. Experience fast-paced gameplay with an extensive beatmap library. No downloads, play free online now!">
  <link rel="canonical" href="https://wosu.dino.icu/" />
  <meta name="google-site-verification" content="mGToKluN68_vEmxRv8x5lsHWLLZKJ3yQIGTGjFnmv7g" />
  <link rel="icon" href="favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <!-- The intro's UI font downloads alongside the scripts (src/ui/fonts.ts loads it; the
       icon font subset is preloaded the same way by tools/iconFont.ts). -->
  <link rel="preload" href="assets/fonts/Exo2.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The whole game, including every menu, renders into one PixiJS canvas.
       This sheet only makes the host element fill the viewport. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
